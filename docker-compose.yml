# QQ AI Agent 一键部署
# 用法: docker compose up -d
# 环境变量从宿主机环境或同目录 .env 读取(参考 .env.example)
services:
  qq-ai-agent:
    build: .
    container_name: qq-ai-agent
    ports:
      - "6199:6199"   # OneBot 反向 WebSocket(需在 OneBot 客户端配置)
      - "8080:8080"   # WebUI 管理控制台
    volumes:
      - ./data:/app/data                       # 持久化运行数据
      - ./config.local.yaml:/app/config.local.yaml:ro  # 可选本地配置覆盖(不存在则忽略)
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - WEBUI_PASSWORD=${WEBUI_PASSWORD:-}
    restart: unless-stopped
