[project]
name = "qq-ai-agent"
version = "1.0.0"
description = "基于 OneBot v11 + Claude Code 模式的万能 QQ AI Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "aiohttp>=3.9",
    "httpx>=0.27",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "openai>=1.30",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
qqbot = "src.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 仓库根即 `src` 包:clone 后 `pip install -e .` 即可在任意目录 `python -m src.main` / `qqbot`
[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-dir]
src = "."
