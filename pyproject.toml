[project]
name = "qq-ai-agent"
version = "1.0.0"
description = "基于 OneBot v11 + Claude Code 模式的万能 QQ AI Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "aiohttp>=3.9",
    "httpx>=0.27",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "openai>=1.30",
    # AstrBot Dashboard(WebUI)依赖
    "fastapi>=0.124",
    "uvicorn>=0.30",
    "hypercorn>=0.17",
    "PyJWT>=2.10",
    "pyotp>=2.9",
    "sqlmodel>=0.0.16",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10",
    "deprecated>=1.2.18",
    "aiofiles>=25.1.0",
    "aiosqlite>=0.21.0",
    "psutil>=5.8.0",
    "packaging>=24.2",
    "pillow>=9.0",
    "certifi>=2024.0.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]
# 多模态感知层(图片/视频/文档/代码):pip install -e ".[vision]"
vision = [
    "opencv-python-headless>=4.8",
    "pytesseract>=0.3.10",
    "PyMuPDF>=1.24",
    "python-pptx>=0.6.23",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "EbookLib>=0.18",
    "beautifulsoup4>=4.12",
]
# 语音层(STT/TTS):pip install -e ".[voice]"
voice = [
    "edge-tts>=6.1",
    "faster-whisper>=1.0",
]
# 知识库层(向量检索):pip install -e ".[knowledge]"
knowledge = [
    "faiss-cpu>=1.8",
    "sentence-transformers>=2.7",
    "trafilatura>=1.8",
]
# 沙箱层(浏览器自动化):pip install -e ".[sandbox]"
sandbox = [
    "playwright>=1.40",
]
# 存储层(渐进式 SQLModel):pip install -e ".[storage]"
storage = [
    "sqlmodel>=0.0.16",
    "apscheduler>=3.10",
]
# 全部可选依赖
all = ["anthropic>=0.40", "pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4",
       "opencv-python-headless>=4.8", "pytesseract>=0.3.10", "PyMuPDF>=1.24",
       "python-pptx>=0.6.23", "python-docx>=1.1", "openpyxl>=3.1", "EbookLib>=0.18",
       "beautifulsoup4>=4.12", "edge-tts>=6.1", "faster-whisper>=1.0",
       "faiss-cpu>=1.8", "sentence-transformers>=2.7", "trafilatura>=1.8",
       "playwright>=1.40", "sqlmodel>=0.0.16", "apscheduler>=3.10"]

[project.scripts]
qqbot = "src.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 仓库根即 `src` 包:clone 后 `pip install -e .` 即可在任意目录 `python -m src.main` / `qqbot`
# 必须显式列出全部子包(含 src.tests):`packages=["src"]` 只打包顶层包,
# 子包缺失会让 CI 的 `import src.tests.*` / `import src.agent` 失败。
[tool.setuptools]
package-dir = { src = "." }
packages = [
    "src", "src.adapter", "src.agent", "src.agent.knowledge", "src.agent.mcp",
    "src.agent.memory", "src.agent.sandbox", "src.agent.tools", "src.pipeline",
    "src.pipeline.stages", "src.plugins", "src.providers", "src.providers.sources",
    "src.security", "src.storage", "src.tests", "src.utils", "src.webui",
    # AstrBot Dashboard 兼容层(astrbot 命名空间)
    "astrbot", "astrbot.api", "astrbot.core", "astrbot.core.agent",
    "astrbot.core.backup", "astrbot.core.computer", "astrbot.core.config",
    "astrbot.core.db", "astrbot.core.db.utils", "astrbot.core.db.vec_db",
    "astrbot.core.db.vec_db.faiss_impl",
    "astrbot.core.knowledge_base", "astrbot.core.message", "astrbot.core.platform",
    "astrbot.core.platform.sources", "astrbot.core.platform.sources.dingtalk",
    "astrbot.core.platform.sources.lark", "astrbot.core.platform.sources.qqofficial",
    "astrbot.core.platform.sources.webchat",
    "astrbot.core.platform.sources.weixin_oc", "astrbot.core.provider",
    "astrbot.core.skills", "astrbot.core.star", "astrbot.core.star.filter",
    "astrbot.core.tools", "astrbot.core.utils", "astrbot.core.utils.t2i",
    "astrbot.dashboard", "astrbot.dashboard.api",
    "astrbot.dashboard.services",
]
