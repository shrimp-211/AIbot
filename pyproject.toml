[project]
name = "qq-ai-agent"
version = "1.0.0"
description = "基于 OneBot v11 + Claude Code 模式的万能 QQ AI Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "aiohttp>=3.9",
    "httpx>=0.27",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "openai>=1.30",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]
# 多模态感知层(图片/视频/文档/代码):pip install -e ".[vision]"
vision = [
    "opencv-python-headless>=4.8",
    "pytesseract>=0.3.10",
    "PyMuPDF>=1.24",
    "python-pptx>=0.6.23",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "EbookLib>=0.18",
    "beautifulsoup4>=4.12",
]
# 语音层(STT/TTS):pip install -e ".[voice]"
voice = [
    "edge-tts>=6.1",
    "faster-whisper>=1.0",
]
# 知识库层(向量检索):pip install -e ".[knowledge]"
knowledge = [
    "faiss-cpu>=1.8",
    "sentence-transformers>=2.7",
    "trafilatura>=1.8",
]
# 全部可选依赖
all = ["anthropic>=0.40", "pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4",
       "opencv-python-headless>=4.8", "pytesseract>=0.3.10", "PyMuPDF>=1.24",
       "python-pptx>=0.6.23", "python-docx>=1.1", "openpyxl>=3.1", "EbookLib>=0.18",
       "beautifulsoup4>=4.12", "edge-tts>=6.1", "faster-whisper>=1.0",
       "faiss-cpu>=1.8", "sentence-transformers>=2.7", "trafilatura>=1.8"]

[project.scripts]
qqbot = "src.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 仓库根即 `src` 包:clone 后 `pip install -e .` 即可在任意目录 `python -m src.main` / `qqbot`
[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-dir]
src = "."
