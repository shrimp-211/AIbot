name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import self-check
        run: python -c "import src.main"

      - name: Core tests
        run: python -m src.tests.core_tests

      - name: Tool integration tests
        run: python -m src.tests.tools_integration_test

      - name: Plugin load tests
        run: python -m src.tests.plugin_load_test
