<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QQ AI Agent 控制台</title>
<style>
  :root {
    --bg: #16161c; --sidebar: #1d1d26; --card: #22222c; --border: #2f2f3d;
    --text: #e8e9f0; --muted: #8b8d9a; --accent: #5b8cff; --green: #3ddc84;
    --red: #ff5d6c; --yellow: #ffc93c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 14px; }

  /* ---- 侧边栏 ---- */
  .layout { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; z-index: 10; }
  .brand { padding: 20px 18px 14px; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
  .brand .logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #8f6bff); display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .nav-group { padding: 12px 10px 4px; font-size: 11px; color: var(--muted); letter-spacing: .5px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 14px; margin: 2px 8px; border-radius: 8px; cursor: pointer; color: var(--muted); border: none; background: none; font-size: 14px; width: calc(100% - 16px); text-align: left; }
  .nav-item:hover { background: rgba(255,255,255,.05); color: var(--text); }
  .nav-item.active { background: var(--accent); color: #fff; }
  .nav-item .ico { width: 18px; text-align: center; font-size: 15px; }
  .nav-spacer { flex: 1; }
  .sidebar-foot { padding: 12px 18px; border-top: 1px solid var(--border); }

  /* ---- 主内容 ---- */
  .main { flex: 1; margin-left: 220px; padding: 24px 30px; max-width: 1200px; }
  .page-title { font-size: 20px; font-weight: 700; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
  .card h3 { margin-bottom: 12px; color: var(--text); font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .hidden { display: none !important; }
  input, textarea, select { background: #1a1a24; border: 1px solid var(--border); color: var(--text); padding: 9px 12px; border-radius: 8px; font-size: 14px; width: 100%; }
  textarea { font-family: inherit; }
  button { background: var(--accent); border: none; color: #fff; padding: 9px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; width: auto; white-space: nowrap; }
  button:hover { opacity: .9; }
  button.secondary { background: #33334a; color: var(--text); }
  button.danger { background: rgba(255,93,108,.15); color: var(--red); }
  button.small { padding: 3px 10px; font-size: 12px; border-radius: 6px; }

  /* ---- 统计卡片 ---- */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .stat b { display: block; font-size: 22px; color: var(--accent); margin-top: 4px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .stat .ok { color: var(--green); } .stat .bad { color: var(--red); }

  /* ---- 列表项 ---- */
  .item { padding: 10px 4px; border-bottom: 1px solid var(--border); }
  .item:last-child { border-bottom: none; }
  .item code { color: var(--accent); font-weight: 600; }
  .item small { color: var(--muted); display: block; margin-top: 3px; line-height: 1.5; }
  .item .actions { margin-top: 6px; display: flex; gap: 8px; }

  /* ---- 对话 ---- */
  .chat-wrap { display: flex; flex-direction: column; height: calc(100vh - 160px); min-height: 400px; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; background: #1a1a24; border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: #2a2a38; border-bottom-left-radius: 4px; }
  .msg.progress { align-self: flex-start; color: var(--muted); font-style: italic; font-size: 13px; background: none; padding: 4px 8px; }
  .msg.reasoning { align-self: flex-start; color: var(--muted); font-size: 12px; opacity: .8; background: none; border-left: 2px solid var(--border); padding: 4px 10px; }
  .chat-input { display: flex; gap: 10px; margin-top: 12px; }
  .chat-input input { flex: 1; }

  /* ---- Provider 卡片 ---- */
  .provider-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .provider-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .provider-card .p-name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .provider-card .p-type { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .provider-card .p-status { margin-top: 8px; font-size: 13px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.ok { background: var(--green); } .dot.bad { background: var(--red); } .dot.idle { background: var(--muted); }

  /* ---- 其他 ---- */
  .error { color: var(--red); margin-top: 8px; font-size: 13px; }
  .msg-green { color: var(--green); margin-left: 8px; font-size: 13px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; background: rgba(91,140,255,.15); color: var(--accent); margin-left: 6px; }
  .muted { color: var(--muted); }
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-box { width: 340px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
  .login-box h1 { font-size: 20px; margin-bottom: 20px; text-align: center; }
  .login-box input { margin-bottom: 14px; }
  code, pre { font-family: "SF Mono", Consolas, monospace; }
  .scroll-area { max-height: 500px; overflow-y: auto; }
</style>
</head>
<body>

<!-- 登录 -->
<div id="loginView" class="login-wrap hidden">
  <div class="login-box">
    <h1>🤖 QQ AI Agent</h1>
    <input type="password" id="password" placeholder="管理密码" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="error hidden" id="loginErr"></div>
    <button onclick="doLogin()" style="width:100%">登录</button>
  </div>
</div>

<!-- 主界面 -->
<div id="mainView" class="layout hidden">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="brand"><span class="logo">🤖</span> QQ AI Agent</div>

    <div class="nav-group">总览</div>
    <button class="nav-item active" data-page="status" onclick="showPage('status')"><span class="ico">📊</span>总览</button>
    <button class="nav-item" data-page="chat" onclick="showPage('chat')"><span class="ico">💬</span>对话</button>

    <div class="nav-group">管理</div>
    <button class="nav-item" data-page="providers" onclick="showPage('providers')"><span class="ico">🔌</span>提供商</button>
    <button class="nav-item" data-page="plugins" onclick="showPage('plugins')"><span class="ico">🧩</span>插件 / 市场</button>
    <button class="nav-item" data-page="tasks" onclick="showPage('tasks')"><span class="ico">⏰</span>定时任务</button>
    <button class="nav-item" data-page="knowledge" onclick="showPage('knowledge')"><span class="ico">📚</span>知识库</button>
    <button class="nav-item" data-page="adapters" onclick="showPage('adapters')"><span class="ico">🌐</span>适配器</button>

    <div class="nav-group">系统</div>
    <button class="nav-item" data-page="tools" onclick="showPage('tools')"><span class="ico">🛠️</span>工具</button>
    <button class="nav-item" data-page="mcp" onclick="showPage('mcp')"><span class="ico">🔗</span>MCP</button>
    <button class="nav-item" data-page="skills" onclick="showPage('skills')"><span class="ico">⚡</span>技能</button>
    <button class="nav-item" data-page="audit" onclick="showPage('audit')"><span class="ico">📜</span>审计</button>
    <button class="nav-item" data-page="subagents" onclick="showPage('subagents')"><span class="ico">👥</span>子代理</button>
    <button class="nav-item" data-page="config" onclick="showPage('config')"><span class="ico">⚙️</span>配置</button>

    <div class="nav-spacer"></div>
    <div class="sidebar-foot">
      <button class="nav-item" onclick="logout()" style="width:100%"><span class="ico">🚪</span>退出登录</button>
    </div>
  </aside>

  <!-- 主内容 -->
  <main class="main">

    <!-- 总览 -->
    <div id="page-status">
      <div class="page-title">📊 总览</div>
      <div class="stats" id="statsBox"></div>
      <div class="card" style="margin-top:16px"><h3>快速操作</h3>
        <div class="row" style="margin-bottom:0">
          <button onclick="showPage('chat')">💬 打开对话</button>
          <button class="secondary" onclick="showPage('knowledge')">📚 知识库</button>
          <button class="secondary" onclick="testProviders()">🔌 测试提供商</button>
          <button class="secondary" onclick="reloadPlugins()">🧩 重载插件</button>
        </div>
      </div>
    </div>

    <!-- 对话 -->
    <div id="page-chat" class="hidden">
      <div class="page-title">💬 对话</div>
      <div class="chat-wrap">
        <div id="chat"></div>
        <div class="chat-input">
          <input id="chatInput" placeholder="输入消息...(可用 /clear 清空会话)" onkeydown="if(event.key==='Enter')sendChat()">
          <button onclick="sendChat()">发送</button>
          <button class="secondary" onclick="clearChat()">清空</button>
        </div>
      </div>
      <div class="card" style="margin-top:16px"><h3>📡 群广播</h3>
        <div class="row" style="margin-bottom:0">
          <input id="broadcastGroup" placeholder="QQ 群号" style="max-width:180px">
          <input id="broadcastText" placeholder="要发送的消息" onkeydown="if(event.key==='Enter')sendBroadcast()">
          <button onclick="sendBroadcast()">发送到群</button>
        </div>
        <div class="error hidden" id="broadcastErr"></div>
      </div>
    </div>

    <!-- 提供商 -->
    <div id="page-providers" class="hidden">
      <div class="page-title">🔌 提供商</div>
      <div class="card">
        <div class="row" style="margin-bottom:14px"><span class="muted">LLM / STT / TTS / Embedding / Rerank 状态</span>
          <button onclick="testProviders()">连通性测试</button><span class="msg-green" id="providerMsg"></span>
        </div>
        <div class="provider-grid" id="providerList"></div>
      </div>
    </div>

    <!-- 插件 / 市场 -->
    <div id="page-plugins" class="hidden">
      <div class="page-title">🧩 插件 / 市场</div>
      <div class="card">
        <h3>已加载插件 <span class="badge" id="handlerCount"></span>
          <button class="secondary small" onclick="reloadPlugins()">重新加载</button><span class="msg-green" id="pluginMsg"></span></h3>
        <div id="pluginList"></div>
      </div>
      <div class="card">
        <h3>插件市场 <button class="secondary small" onclick="loadMarket()">刷新</button><span class="msg-green" id="marketMsg"></span></h3>
        <div id="marketList"><small class="muted">加载中...</small></div>
      </div>
    </div>

    <!-- 定时任务 -->
    <div id="page-tasks" class="hidden">
      <div class="page-title">⏰ 定时任务</div>
      <div class="card">
        <h3>新建任务</h3>
        <div class="row"><input id="taskWhen" placeholder="触发时间,如: 每天09:00 / 每30分钟 / 明天20:00">
          <input id="taskText" placeholder="任务内容" onkeydown="if(event.key==='Enter')addTask()"></div>
        <div class="row"><input id="taskGroup" placeholder="目标群号(留空=默认)" style="max-width:220px">
          <button onclick="addTask()">添加</button><span class="msg-green" id="taskMsg"></span></div>
        <div class="error hidden" id="taskErr"></div>
      </div>
      <div class="card"><h3>已配置任务</h3><div id="taskList"></div></div>
      <div class="card"><h3>执行历史</h3><div id="taskHistory"></div></div>
    </div>

    <!-- 知识库 -->
    <div id="page-knowledge" class="hidden">
      <div class="page-title">📚 知识库</div>
      <div class="card"><h3>状态</h3><div id="kbStats"></div></div>
      <div class="card"><h3>添加知识</h3>
        <input id="kbTitle" placeholder="标题">
        <div class="row" style="margin-top:10px"><input id="kbUrl" placeholder="网页 URL(与内容二选一)">
          <input id="kbFile" placeholder="本地文件路径(与内容二选一)"></div>
        <textarea id="kbContent" style="height:110px;margin-top:10px" placeholder="知识内容"></textarea>
        <div class="row" style="margin-top:10px"><input id="kbCategory" placeholder="分类(默认通用)" value="通用" style="max-width:180px">
          <button onclick="addKnowledge()">添加入库</button><span class="msg-green" id="kbMsg"></span></div>
        <div class="error hidden" id="kbErr"></div>
      </div>
      <div class="card"><h3>检索测试</h3>
        <div class="row"><input id="kbQuery" placeholder="输入问题测试混合检索" onkeydown="if(event.key==='Enter')searchKnowledge()">
          <button onclick="searchKnowledge()">检索</button></div>
        <div id="kbSearchResult"></div>
      </div>
      <div class="card"><h3>文档列表 <button class="secondary small" onclick="loadKnowledge()">刷新</button></h3><div id="kbDocs"></div></div>
    </div>

    <!-- 适配器 -->
    <div id="page-adapters" class="hidden">
      <div class="page-title">🌐 适配器</div>
      <div class="card"><h3>平台适配器状态</h3><div id="adapterList"></div></div>
    </div>

    <!-- 工具 -->
    <div id="page-tools" class="hidden">
      <div class="page-title">🛠️ 工具</div>
      <div class="card"><div class="scroll-area" id="toolList"></div></div>
    </div>

    <!-- MCP -->
    <div id="page-mcp" class="hidden">
      <div class="page-title">🔗 MCP</div>
      <div class="card"><h3>MCP 服务器</h3><div id="mcpList"></div></div>
    </div>

    <!-- 技能 -->
    <div id="page-skills" class="hidden">
      <div class="page-title">⚡ 技能</div>
      <div class="card"><h3>SKILL.md 技能</h3><div id="skillList"></div></div>
    </div>

    <!-- 审计 -->
    <div id="page-audit" class="hidden">
      <div class="page-title">📜 审计</div>
      <div class="card"><h3>操作审计日志</h3><div class="scroll-area" id="auditList"></div></div>
    </div>

    <!-- 子代理 -->
    <div id="page-subagents" class="hidden">
      <div class="page-title">👥 子代理</div>
      <div class="card"><h3>子代理任务</h3><div id="subagentList"></div></div>
    </div>

    <!-- 配置 -->
    <div id="page-config" class="hidden">
      <div class="page-title">⚙️ 配置</div>
      <div class="card">
        <div class="row"><button onclick="loadConfig()">刷新</button>
          <button class="secondary" onclick="saveConfig()">保存配置</button><span class="msg-green" id="cfgSaveMsg"></span></div>
        <textarea id="cfgEditor" style="height:60vh;font-family:monospace;font-size:13px;margin-top:8px;white-space:pre" placeholder="加载中..."></textarea>
      </div>
    </div>

  </main>
</div>

<script>
let token = localStorage.getItem('token') || '';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, method = 'GET', body) {
  const opt = { method, headers: { 'Authorization': 'Bearer ' + token } };
  if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const res = await fetch(path, opt);
  return { status: res.status, data: await res.json().catch(() => ({})) };
}

async function doLogin() {
  const pw = $('password').value;
  const res = await api('/api/login', 'POST', { password: pw });
  if (res.data.ok) {
    token = res.data.token; localStorage.setItem('token', token);
    $('loginView').classList.add('hidden'); $('mainView').classList.remove('hidden');
    loadStatus();
  } else {
    $('loginErr').textContent = res.data.error || '登录失败'; $('loginErr').classList.remove('hidden');
  }
}

function showPage(name) {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.page === name));
  const pages = ['status','chat','providers','plugins','tasks','knowledge','adapters','tools','mcp','skills','audit','subagents','config'];
  pages.forEach(p => $('page-' + p).classList.toggle('hidden', p !== name));
  if (name === 'tools') loadTools();
  if (name === 'tasks') { loadTasks(); loadTaskHistory(); }
  if (name === 'mcp') loadMCP();
  if (name === 'skills') loadSkills();
  if (name === 'audit') loadAudit();
  if (name === 'subagents') loadSubagents();
  if (name === 'plugins') loadPlugins();
  if (name === 'config') loadConfig();
  if (name === 'adapters') loadAdapters();
  if (name === 'providers') loadProviders();
  if (name === 'knowledge') loadKnowledge();
  if (name === 'status') loadStatus();
  if (name === 'chat') connectChat();
}

async function loadStatus() {
  const res = await api('/api/status');
  if (res.status === 401) return logout();
  const s = res.data;
  const h = Math.floor(s.uptime / 3600), m = Math.floor((s.uptime % 3600) / 60);
  const up = (h > 0 ? h + 'h ' : '') + m + 'm';
  const usg = s.usage || {};
  $('statsBox').innerHTML = `
    <div class="stat"><span>模型</span><b>${esc(s.model)}</b><span class="muted">${esc(s.provider)}</span></div>
    <div class="stat"><span>工具数量</span><b>${s.tools_count}</b></div>
    <div class="stat"><span>OneBot 客户端</span><b class="${s.connected ? 'ok' : 'bad'}">${s.connected ? '已连接' : '未连接'}</b></div>
    <div class="stat"><span>运行时间</span><b>${up}</b></div>
    <div class="stat"><span>已处理消息</span><b>${s.messages_processed || 0}</b></div>
    <div class="stat"><span>累计成本</span><b>$${usg.total_cost ? usg.total_cost.toFixed(4) : '0.0000'}</b></div>`;
}

async function loadTools() {
  const res = await api('/api/tools');
  if (res.status === 401) return logout();
  const tools = res.data.tools || [];
  $('toolList').innerHTML = tools.length
    ? tools.map(t => `<div class="item"><code>${esc(t.name)}</code><small>${esc(t.description)}</small></div>`).join('')
    : '<small class="muted">无工具</small>';
}

async function loadTasks() {
  const res = await api('/api/tasks');
  if (res.status === 401) return logout();
  const tasks = res.data.tasks || [];
  $('taskList').innerHTML = tasks.length
    ? tasks.map(t => `<div class="item"><code>${esc(t.desc)}</code><small>${esc(t.text)} — 下次: ${esc(t.next_at)}</small>
      <div class="actions"><button class="secondary small" onclick="deleteTask('${t.task_id}')">删除</button></div></div>`).join('')
    : '<small class="muted">暂无定时任务</small>';
}
async function addTask() {
  $('taskMsg').textContent = ''; $('taskErr').classList.add('hidden');
  const when = $('taskWhen').value.trim(), text = $('taskText').value.trim();
  const group_id = $('taskGroup').value.trim();
  if (!when || !text) { $('taskErr').textContent = '请填写触发时间和内容'; $('taskErr').classList.remove('hidden'); return; }
  const res = await api('/api/tasks', 'POST', { when, text, target_group: group_id });
  if (res.data.ok) { $('taskMsg').textContent = '已添加: ' + (res.data.result.desc || ''); $('taskWhen').value=''; $('taskText').value=''; loadTasks(); }
  else { $('taskErr').textContent = res.data.result?.error || res.data.error || '添加失败'; $('taskErr').classList.remove('hidden'); }
}
async function deleteTask(id) { await api('/api/tasks', 'DELETE', { task_id: id }); loadTasks(); }
async function loadTaskHistory() {
  const res = await api('/api/tasks/history');
  if (res.status === 401) return logout();
  const h = res.data.history || [];
  $('taskHistory').innerHTML = h.length
    ? h.map(x => `<div class="item"><code>${esc(x.time || '')} ${x.ok ? '✅' : '❌'}</code><small>${esc(x.desc || x.text || '')}</small></div>`).join('')
    : '<small class="muted">暂无执行历史</small>';
}

async function loadMCP() {
  const res = await api('/api/mcp');
  if (res.status === 401) return logout();
  const s = res.data.servers || [];
  $('mcpList').innerHTML = s.length
    ? s.map(x => `<div class="item"><code>${esc(x.name)}</code><small>运行中: ${x.running ? 'OK' : 'X'} | ${esc(x.command)} | 工具: ${(x.tools || []).join(', ') || '无'}</small></div>`).join('')
    : '<small class="muted">未配置 MCP 服务器(见 config.yaml 的 mcp.servers)</small>';
}

async function loadSkills() {
  const res = await api('/api/skills');
  if (res.status === 401) return logout();
  const s = res.data.skills || [];
  $('skillList').innerHTML = s.length
    ? s.map(x => `<div class="item"><code>${esc(x.name)}</code><small>${esc(x.description)}</small></div>`).join('')
    : '<small class="muted">暂无技能(SKILL.md)</small>';
}

async function loadAudit() {
  const res = await api('/api/audit');
  if (res.status === 401) return logout();
  const e = res.data.audit || [];
  $('auditList').innerHTML = e.length
    ? e.map(x => `<div class="item"><code>${esc(x.ts || '')} [${esc(x.decision || '')}]</code>
      <small>${esc(x.tool_name || x.action || '')} — ${esc(x.reason || '')}</small>
      <small class="muted">user=${esc(x.user_id)} | ${esc((x.detail || '').slice(0, 120))}</small></div>`).join('')
    : '<small class="muted">暂无审计记录</small>';
}

async function loadSubagents() {
  const res = await api('/api/subagents');
  if (res.status === 401) return logout();
  const d = res.data;
  const running = (d.running || []).length;
  const results = d.results || {};
  const done = Object.values(results).filter(r => r.status === 'done').length;
  $('subagentList').innerHTML = `
    <div class="item"><code>运行中: ${running} | 已完成: ${done}</code></div>
    ${Object.entries(results).map(([id, r]) => `<div class="item"><code>${esc(id)} — ${esc(r.status)}</code><small>${esc((r.result || r.error || '').slice(0, 200))}</small></div>`).join('')
    || '<small class="muted">暂无子代理任务</small>'}`;
}

async function loadPlugins() {
  const res = await api('/api/plugins');
  if (res.status === 401) return logout();
  const p = res.data.plugins || [];
  $('handlerCount').textContent = 'handler: ' + (res.data.handler_count || 0);
  $('pluginList').innerHTML = p.length
    ? p.map(x => `<div class="item"><code>${esc(x.name)} ${x.version ? 'v'+esc(x.version) : ''}</code>
      <small>${esc(x.description)}</small>
      <small class="muted">命令: ${esc((x.commands||[]).join(', ') || '无')} | 依赖: ${esc((x.dependencies||[]).join(',') || '无')}</small></div>`).join('')
    : '<small class="muted">暂无外部插件</small>';
}
async function loadMarket() {
  $('marketMsg').textContent = '';
  const res = await api('/api/market');
  if (res.status === 401) return logout();
  const p = res.data.plugins || [];
  $('marketList').innerHTML = p.length
    ? p.map(x => `<div class="item"><code>${esc(x.name)} ${x.version ? 'v'+esc(x.version) : ''}</code>
      <small>${esc(x.description)}${x.author ? ' — ' + esc(x.author) : ''} ${(x.tags||[]).join(',') || ''}</small>
      <div class="actions"><button class="secondary small" onclick="installMarket('${x.name}')">安装</button></div></div>`).join('')
    : '<small class="muted">市场暂无插件</small>';
}
async function installMarket(name) {
  $('marketMsg').textContent = '安装中...';
  const res = await api('/api/market/install', 'POST', { name });
  if (res.data.ok) { $('marketMsg').textContent = `已安装 ${name}`; loadPlugins(); }
  else { $('marketMsg').textContent = '安装失败: ' + (res.data.error || ''); }
}
async function reloadPlugins() {
  $('pluginMsg').textContent = '';
  const res = await api('/api/plugins/reload', 'POST', {});
  if (res.data.ok) { $('pluginMsg').textContent = `已重载 ${res.data.plugins} 个插件`; loadPlugins(); }
  else { $('pluginMsg').textContent = '重载失败: ' + (res.data.error || ''); }
}

async function loadProviders() {
  const res = await api('/api/providers');
  if (res.status === 401) return logout();
  const p = res.data.providers || [];
  $('providerList').innerHTML = p.length
    ? p.map(x => `<div class="provider-card"><div class="p-name">${esc(x.name)} <span class="dot idle"></span></div>
      <div class="p-type">${esc(x.type)}</div><div class="p-status muted">模型: ${esc(x.model || '默认')}</div></div>`).join('')
    : '<small class="muted">暂无启用的 Provider(见 config.yaml)</small>';
}
async function testProviders() {
  $('providerMsg').textContent = '测试中...';
  const res = await api('/api/providers/test', 'POST', {});
  if (res.status === 401) return logout();
  const results = res.data.results || [];
  $('providerList').innerHTML = results.length
    ? results.map(r => `<div class="provider-card"><div class="p-name">${esc(r.name)} <span class="dot ${r.ok ? 'ok' : 'bad'}"></span></div>
      <div class="p-status">${r.ok ? '✅ 正常' : '❌ 失败'}</div>
      <div class="p-type muted">${esc(r.error || '')}</div></div>`).join('')
    : '<small class="muted">无可用 Provider</small>';
  $('providerMsg').textContent = '';
}

async function loadKnowledge() {
  const res = await api('/api/knowledge');
  if (res.status === 401) return logout();
  const d = res.data, st = d.stats;
  $('kbStats').innerHTML = st
    ? `<div class="stats">
        <div class="stat"><span>文档数</span><b>${st.docs}</b></div>
        <div class="stat"><span>分块数</span><b>${st.chunks}</b></div>
        <div class="stat"><span>向量索引</span><b class="${st.vector_index ? 'ok' : 'bad'}">${st.vector_index ? '✅' : '⚠️'}</b></div>
        <div class="stat"><span>Embedding</span><b class="${st.embedding ? 'ok' : 'bad'}">${st.embedding ? '✅' : '⚠️'}</b></div>
        <div class="stat"><span>Rerank</span><b class="${st.reranker ? 'ok' : 'bad'}">${st.reranker ? '✅' : '⚠️'}</b></div>
        <div class="stat"><span>索引向量</span><b>${st.index_vectors}</b></div>
      </div>`
    : '<small class="muted">知识库未启用</small>';
  const docs = d.docs || [];
  $('kbDocs').innerHTML = docs.length
    ? docs.map(x => `<div class="item"><code>${esc(x.title)}</code><small>分类: ${esc(x.category)} | 分块: ${x.chunks}</small>
      <div class="actions"><button class="danger small" onclick="deleteKnowledge('${x.doc_id}')">删除</button></div></div>`).join('')
    : '<small class="muted">暂无文档(共 ' + (d.total || 0) + ' 篇)</small>';
}
async function addKnowledge() {
  $('kbMsg').textContent = ''; $('kbErr').classList.add('hidden');
  const body = { title: $('kbTitle').value.trim(), content: $('kbContent').value.trim(), url: $('kbUrl').value.trim(), file: $('kbFile').value.trim(), category: $('kbCategory').value.trim() || '通用' };
  if (!body.title) { $('kbErr').textContent = '请填写标题'; $('kbErr').classList.remove('hidden'); return; }
  const res = await api('/api/knowledge', 'POST', body);
  if (res.data.ok) { $('kbMsg').textContent = '已入库: ' + res.data.result.chunks + ' 个分块'; $('kbContent').value=''; $('kbUrl').value=''; $('kbFile').value=''; loadKnowledge(); }
  else { $('kbErr').textContent = res.data.error || '入库失败'; $('kbErr').classList.remove('hidden'); }
}
async function deleteKnowledge(id) { await api('/api/knowledge', 'DELETE', { doc_id: id }); loadKnowledge(); }
async function searchKnowledge() {
  const query = $('kbQuery').value.trim();
  if (!query) return;
  const res = await api('/api/knowledge/search', 'POST', { query, limit: 3 });
  if (res.status === 401) return logout();
  const r = res.data.result || {}, results = r.results || [];
  $('kbSearchResult').innerHTML = results.length
    ? `<small class="muted">模式: ${esc(r.mode || '')} | 命中 ${r.count || 0}</small>` + results.map(x =>
      `<div class="item"><code>${esc(x.title)}</code><small>${esc((x.snippet || x.content || '').slice(0, 300))}</small></div>`).join('')
    : '<small class="muted">无匹配结果</small>';
}

let cfgLoaded = false;
async function loadConfig() {
  const res = await api('/api/config');
  if (res.status === 401) return logout();
  $('cfgEditor').value = res.data.content || ''; cfgLoaded = true;
}
async function saveConfig() {
  $('cfgSaveMsg').textContent = '';
  if (!$('cfgEditor').value.trim()) { $('cfgSaveMsg').textContent = '内容不能为空'; return; }
  const res = await api('/api/config', 'POST', { content: $('cfgEditor').value });
  if (res.data.ok) { $('cfgSaveMsg').textContent = '已保存(需重启生效)'; }
  else { $('cfgSaveMsg').textContent = '保存失败: ' + (res.data.error || ''); $('cfgSaveMsg').style.color = '#ff5d6c'; }
}

async function loadAdapters() {
  const res = await api('/api/adapters');
  if (res.status === 401) return logout();
  const a = res.data.adapters || [];
  $('adapterList').innerHTML = a.length
    ? a.map(x => `<div class="item"><code>${esc(x.name)} (${esc(x.type)})</code>
      <small>平台: ${esc(x.platform)} | 状态: ${x.connected ? '✅ 已连接' : '⚠️ 未连接'}</small></div>`).join('')
    : '<small class="muted">无适配器</small>';
}

let chatWs = null;
function connectChat() {
  if (chatWs && chatWs.readyState <= 1) return;
  chatWs = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/chat', ['chat', 'auth.' + token]);
  let streamBubble = null;
  chatWs.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.role === 'progress') { addChat('progress', d.text); return; }
    if (d.role === 'reasoning') { addChat('reasoning', d.text); return; }
    if (d.role === 'stream') {
      if (!streamBubble || !document.body.contains(streamBubble)) {
        streamBubble = document.createElement('div');
        streamBubble.className = 'msg assistant';
        streamBubble.innerHTML = `<span></span>`;
        $('chat').appendChild(streamBubble);
      }
      streamBubble.querySelector('span').textContent += d.text;
      $('chat').scrollTop = $('chat').scrollHeight;
      return;
    }
    if (streamBubble && document.body.contains(streamBubble)) {
      streamBubble.querySelector('span').textContent = d.text;
      streamBubble = null;
    } else {
      addChat('assistant', d.text);
    }
  };
  chatWs.onclose = () => { chatWs = null; };
}
function addChat(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const label = role === 'user' ? '我' : (role === 'progress' ? '⏳' : (role === 'reasoning' ? '🧠' : 'AI'));
  div.innerHTML = (role === 'user' || role === 'assistant') ? `<span>${esc(text)}</span>` : `<b>${label}:</b> <span>${esc(text)}</span>`;
  $('chat').appendChild(div);
  $('chat').scrollTop = $('chat').scrollHeight;
}
function clearChat() {
  $('chat').innerHTML = '';
  if (chatWs && chatWs.readyState === 1) chatWs.send(JSON.stringify({ text: '/clear', user_id: localStorage.getItem('webui_client_id') || 'webui' }));
}
function sendChat() {
  const text = $('chatInput').value.trim();
  if (!text || !chatWs || chatWs.readyState !== 1) return;
  addChat('user', text);
  $('chatInput').value = '';
  let clientId = localStorage.getItem('webui_client_id');
  if (!clientId) { clientId = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('webui_client_id', clientId); }
  chatWs.send(JSON.stringify({ text, user_id: clientId }));
}
async function sendBroadcast() {
  const group_id = $('broadcastGroup').value.trim();
  const text = $('broadcastText').value.trim();
  $('broadcastErr').classList.add('hidden');
  if (!group_id || !text) { $('broadcastErr').textContent = '请填写群号和消息'; $('broadcastErr').classList.remove('hidden'); return; }
  const res = await api('/api/broadcast', 'POST', { group_id, text });
  if (res.data.ok) { $('broadcastText').value = ''; }
  else { $('broadcastErr').textContent = res.data.error || '发送失败'; $('broadcastErr').classList.remove('hidden'); }
}
function logout() {
  token = ''; localStorage.removeItem('token');
  $('mainView').classList.add('hidden'); $('loginView').classList.remove('hidden');
}
if (token) { $('loginView').classList.add('hidden'); $('mainView').classList.remove('hidden'); loadStatus(); }
</script>
