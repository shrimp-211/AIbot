<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QQ AI Agent 控制台</title>
<style>
  :root {
    --bg: #0f1117; --card: #1a1d26; --border: #2a2e3a;
    --text: #e6e8ee; --muted: #8b90a0; --accent: #4f8cff; --green: #34c759;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .container { max-width: 1000px; margin: 0 auto; padding: 24px; }
  .login { max-width: 360px; margin: 20vh auto; }
  h1 { font-size: 22px; margin-bottom: 20px; }
  h3 { margin-bottom: 12px; color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  input, textarea, button { background: #14161d; border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 14px; width: 100%; }
  button { background: var(--accent); border: none; cursor: pointer; font-weight: 600; width: auto; padding: 10px 18px; }
  button:hover { opacity: .9; }
  button.secondary { background: #2a2e3a; }
  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .hidden { display: none; }
  .tool { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .tool:last-child { border-bottom: none; }
  .tool code { color: var(--accent); }
  .tool small { color: var(--muted); display: block; margin-top: 2px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .stat b { display: block; font-size: 20px; color: var(--accent); }
  .stat span { font-size: 12px; color: var(--muted); }
  #chat { height: 320px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 12px; background: #14161d; }
  #chat .msg { margin-bottom: 10px; }
  #chat .msg b { color: var(--accent); }
  #chat .msg.assistant b { color: var(--green); }
  #chat .msg.progress { color: var(--muted); font-style: italic; font-size: 13px; }
  .nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .nav button { background: transparent; border: 1px solid var(--border); font-size: 13px; padding: 8px 12px; border-radius: 6px; }
  .nav button.active { background: var(--accent); border-color: var(--accent); }
  .error { color: #ff6b6b; margin-top: 8px; font-size: 13px; }
  .msg-green { color: var(--green); margin-left: 8px; font-size: 13px; }
</style>
</head>
<body>
<div id="loginView" class="container login">
  <h1>QQ AI Agent 控制台</h1>
  <div class="card">
    <input type="password" id="password" placeholder="管理密码" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="error hidden" id="loginErr"></div>
    <div class="row" style="margin-top:12px">
      <button onclick="doLogin()">登录</button>
    </div>
  </div>
</div>

<div id="mainView" class="container hidden">
  <h1>QQ AI Agent 控制台</h1>
  <div class="nav">
    <button class="active" data-page="status" onclick="showPage('status')">状态</button>
    <button data-page="tools" onclick="showPage('tools')">工具</button>
    <button data-page="tasks" onclick="showPage('tasks')">定时任务</button>
    <button data-page="mcp" onclick="showPage('mcp')">MCP</button>
    <button data-page="skills" onclick="showPage('skills')">技能</button>
    <button data-page="audit" onclick="showPage('audit')">审计</button>
    <button data-page="subagents" onclick="showPage('subagents')">子代理</button>
    <button data-page="plugins" onclick="showPage('plugins')">插件</button>
    <button data-page="config" onclick="showPage('config')">配置</button>
    <button data-page="adapters" onclick="showPage('adapters')">适配器</button>
    <button data-page="providers" onclick="showPage('providers')">提供商</button>
    <button data-page="knowledge" onclick="showPage('knowledge')">知识库</button>
    <button data-page="chat" onclick="showPage('chat')">聊天测试</button>
  </div>

  <div id="page-status"><div class="stats" id="statsBox"></div></div>
  <div id="page-tools" class="hidden"><div class="card"><div id="toolList"></div></div></div>
  <div id="page-tasks" class="hidden">
    <div class="card">
      <h3>新建定时任务</h3>
      <div class="row">
        <input id="taskWhen" placeholder="触发时间,如: 每天09:00 / 每30分钟 / 明天20:00">
        <input id="taskText" placeholder="任务内容(发送给群的文本)" onkeydown="if(event.key==='Enter')addTask()">
      </div>
      <div class="row">
        <input id="taskGroup" placeholder="目标群号(留空=按任务原配置)">
        <button onclick="addTask()">添加</button>
        <span class="msg-green" id="taskMsg"></span>
      </div>
      <div class="error hidden" id="taskErr"></div>
    </div>
    <div class="card">
      <h3>已配置任务</h3><div id="taskList"></div>
    </div>
    <div class="card">
      <h3>执行历史</h3><div id="taskHistory"></div>
    </div>
  </div>
  <div id="page-mcp" class="hidden"><div class="card"><div id="mcpList"></div></div></div>
  <div id="page-skills" class="hidden"><div class="card"><div id="skillList"></div></div></div>
  <div id="page-audit" class="hidden"><div class="card"><div id="auditList"></div></div></div>
  <div id="page-subagents" class="hidden"><div class="card"><div id="subagentList"></div></div></div>

  <div id="page-plugins" class="hidden">
    <div class="card">
      <div class="row"><h3 style="margin:0">已加载插件</h3><span id="handlerCount" style="color:var(--muted)"></span>
        <button class="secondary" onclick="reloadPlugins()">重新加载</button><span class="msg-green" id="pluginMsg"></span>
      </div>
      <div id="pluginList"></div>
    </div>
    <div class="card">
      <div class="row"><h3 style="margin:0">插件市场</h3>
        <button class="secondary" onclick="loadMarket()">刷新</button><span class="msg-green" id="marketMsg"></span>
      </div>
      <div id="marketList"><small>加载中...</small></div>
    </div>
  </div>

  <div id="page-config" class="hidden">
    <div class="card">
      <div class="row">
        <button onclick="loadConfig()">刷新</button>
        <button class="secondary" onclick="saveConfig()">保存配置</button>
        <span class="msg-green" id="cfgSaveMsg"></span>
      </div>
      <textarea id="cfgEditor" style="height:500px;font-family:monospace;font-size:13px;margin-top:8px;white-space:pre" placeholder="加载中..."></textarea>
    </div>
  </div>

  <div id="page-adapters" class="hidden">
    <div class="card"><h3>适配器状态</h3><div id="adapterList"></div></div>
  </div>

  <div id="page-providers" class="hidden">
    <div class="card">
      <div class="row"><h3 style="margin:0">Provider 状态</h3>
        <button onclick="testProviders()">连通性测试</button><span class="msg-green" id="providerMsg"></span>
      </div>
      <div id="providerList"></div>
    </div>
  </div>

  <div id="page-knowledge" class="hidden">
    <div class="card">
      <h3>知识库状态</h3><div id="kbStats"></div>
    </div>
    <div class="card">
      <h3>添加知识</h3>
      <input id="kbTitle" placeholder="标题">
      <div class="row" style="margin-top:10px">
        <input id="kbUrl" placeholder="网页 URL(与内容二选一)">
        <input id="kbFile" placeholder="本地文件路径(与内容二选一)">
      </div>
      <textarea id="kbContent" style="height:120px;margin-top:10px" placeholder="知识内容"></textarea>
      <div class="row" style="margin-top:10px">
        <input id="kbCategory" placeholder="分类(默认通用)" value="通用">
        <button onclick="addKnowledge()">添加入库</button><span class="msg-green" id="kbMsg"></span>
      </div>
      <div class="error hidden" id="kbErr"></div>
    </div>
    <div class="card">
      <h3>检索测试</h3>
      <div class="row">
        <input id="kbQuery" placeholder="输入问题测试混合检索" onkeydown="if(event.key==='Enter')searchKnowledge()">
        <button onclick="searchKnowledge()">检索</button>
      </div>
      <div id="kbSearchResult"></div>
    </div>
    <div class="card">
      <h3>文档列表 <button class="secondary" onclick="loadKnowledge()">刷新</button></h3>
      <div id="kbDocs"></div>
    </div>
  </div>

  <div id="page-chat" class="hidden">
    <div class="card">
      <div id="chat"></div>
      <div class="row" style="margin-top:12px">
        <input id="chatInput" placeholder="输入消息测试 Agent...(/clear 清空会话)" onkeydown="if(event.key==='Enter')sendChat()">
        <button onclick="sendChat()">发送</button>
        <button class="secondary" onclick="clearChat()">清空会话</button>
      </div>
    </div>
    <div class="card">
      <b>群广播</b>
      <div class="row" style="margin-top:10px">
        <input id="broadcastGroup" placeholder="QQ 群号">
        <input id="broadcastText" placeholder="要发送的消息" onkeydown="if(event.key==='Enter')sendBroadcast()">
        <button onclick="sendBroadcast()">发送到群</button>
      </div>
      <div id="broadcastErr" class="error hidden"></div>
    </div>
  </div>
</div>

<script>
let token = localStorage.getItem('token') || '';
const $ = id => document.getElementById(id);

async function api(path, method = 'GET', body) {
  const opt = { method, headers: { 'Authorization': 'Bearer ' + token } };
  if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const res = await fetch(path, opt);
  return { status: res.status, data: await res.json().catch(() => ({})) };
}

async function doLogin() {
  const pw = $('password').value;
  const res = await api('/api/login', 'POST', { password: pw });
  if (res.data.ok) {
    token = res.data.token;
    localStorage.setItem('token', token);
    $('loginView').classList.add('hidden');
    $('mainView').classList.remove('hidden');
    loadStatus();
  } else {
    $('loginErr').textContent = res.data.error || '登录失败';
    $('loginErr').classList.remove('hidden');
  }
}

function showPage(name) {
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.page === name));
  const pages = ['status', 'tools', 'tasks', 'mcp', 'skills', 'audit', 'subagents', 'plugins', 'config', 'adapters', 'providers', 'knowledge', 'chat'];
  pages.forEach(p => $('page-' + p).classList.toggle('hidden', p !== name));
  if (name === 'tools') loadTools();
  if (name === 'tasks') { loadTasks(); loadTaskHistory(); }
  if (name === 'mcp') loadMCP();
  if (name === 'skills') loadSkills();
  if (name === 'audit') loadAudit();
  if (name === 'subagents') loadSubagents();
  if (name === 'plugins') loadPlugins();
  if (name === 'config') loadConfig();
  if (name === 'adapters') loadAdapters();
  if (name === 'providers') loadProviders();
  if (name === 'knowledge') loadKnowledge();
  if (name === 'chat') connectChat();
}

async function loadStatus() {
  const res = await api('/api/status');
  if (res.status === 401) return logout();
  const s = res.data;
  const uptime = Math.floor(s.uptime / 60) + ' 分钟';
  $('statsBox').innerHTML = `
    <div class="stat"><b>${s.model}</b><span>模型 / ${s.provider}</span></div>
    <div class="stat"><b>${s.tools_count}</b><span>工具数量</span></div>
    <div class="stat"><b>${s.connected ? '已连接' : '未连接'}</b><span>OneBot 客户端</span></div>
    <div class="stat"><b>${uptime}</b><span>运行时间</span></div>`;
}

async function loadTools() {
  const res = await api('/api/tools');
  if (res.status === 401) return logout();
  const tools = res.data.tools || [];
  $('toolList').innerHTML = tools.map(t =>
    `<div class="tool"><code>${t.name}</code><small>${t.description}</small></div>`).join('');
}

async function loadTasks() {
  const res = await api('/api/tasks');
  if (res.status === 401) return logout();
  const tasks = res.data.tasks || [];
  $('taskList').innerHTML = tasks.length
    ? tasks.map(t => `<div class="tool"><code>${t.desc}</code><small>${t.text} — 下次: ${t.next_at}</small>
      <button class="secondary" style="padding:2px 10px;margin-top:4px" onclick="deleteTask('${t.task_id}')">删除</button></div>`).join('')
    : '<small>暂无定时任务</small>';
}
async function addTask() {
  $('taskMsg').textContent = ''; $('taskErr').classList.add('hidden');
  const when = $('taskWhen').value.trim(), text = $('taskText').value.trim();
  const group_id = $('taskGroup').value.trim();
  if (!when || !text) { $('taskErr').textContent = '请填写触发时间和内容'; $('taskErr').classList.remove('hidden'); return; }
  const res = await api('/api/tasks', 'POST', { when, text, target_group: group_id });
  if (res.data.ok) { $('taskMsg').textContent = '已添加: ' + (res.data.result.desc || ''); $('taskWhen').value=''; $('taskText').value=''; loadTasks(); }
  else { $('taskErr').textContent = res.data.result?.error || res.data.error || '添加失败'; $('taskErr').classList.remove('hidden'); }
}
async function deleteTask(task_id) {
  const res = await api('/api/tasks', 'DELETE', { task_id });
  loadTasks();
}
async function loadTaskHistory() {
  const res = await api('/api/tasks/history');
  if (res.status === 401) return logout();
  const history = res.data.history || [];
  $('taskHistory').innerHTML = history.length
    ? history.map(h => `<div class="tool"><code>${h.time || ''} ${h.ok ? '✅' : '❌'}</code><small>${h.desc || h.text || ''}</small></div>`).join('')
    : '<small>暂无执行历史</small>';
}

async function loadMCP() {
  const res = await api('/api/mcp');
  if (res.status === 401) return logout();
  const servers = res.data.servers || [];
  $('mcpList').innerHTML = servers.length
    ? servers.map(s => `
      <div class="tool">
        <code>${s.name}</code>
        <small>运行中: ${s.running ? 'OK' : 'X'} | ${s.command} | 工具: ${(s.tools || []).join(', ') || '无'}</small>
      </div>`).join('')
    : '<small>未配置 MCP 服务器(见 config.yaml 的 mcp.servers)</small>';
}

async function loadSkills() {
  const res = await api('/api/skills');
  if (res.status === 401) return logout();
  const skills = res.data.skills || [];
  $('skillList').innerHTML = skills.length
    ? skills.map(s => `<div class="tool"><code>${s.name}</code><small>${s.description}</small></div>`).join('')
    : '<small>暂无技能(SKILL.md)</small>';
}

async function loadAudit() {
  const res = await api('/api/audit');
  if (res.status === 401) return logout();
  const entries = res.data.audit || [];
  $('auditList').innerHTML = entries.length
    ? entries.map(e => `
      <div class="tool">
        <code>${e.ts || ''} [${e.decision || ''}]</code>
        <small>${e.tool_name || e.action || ''} — ${e.reason || ''}</small>
        <small style="color:var(--muted)">user=${e.user_id} | ${(e.detail || '').slice(0, 120)}</small>
      </div>`).join('')
    : '<small>暂无审计记录</small>';
}

async function loadSubagents() {
  const res = await api('/api/subagents');
  if (res.status === 401) return logout();
  const d = res.data;
  const running = (d.running || []).length;
  const results = d.results || {};
  const done = Object.values(results).filter(r => r.status === 'done').length;
  $('subagentList').innerHTML = `
    <div class="tool"><code>运行中: ${running} | 已完成: ${done}</code></div>
    ${Object.entries(results).map(([id, r]) => `
      <div class="tool"><code>${id} — ${r.status}</code><small>${(r.result || r.error || '').slice(0, 200)}</small></div>`).join('')
    || '<small>暂无子代理任务</small>'}`;
}

async function loadPlugins() {
  const res = await api('/api/plugins');
  if (res.status === 401) return logout();
  const plugins = res.data.plugins || [];
  $('handlerCount').textContent = ` (handler: ${res.data.handler_count || 0})`;
  $('pluginList').innerHTML = plugins.length
    ? plugins.map(p => `
      <div class="tool">
        <code>${p.name} ${p.version ? 'v'+p.version : ''}</code>
        <small>${p.description}</small>
        <small style="color:var(--muted)">命令: ${(p.commands||[]).join(', ') || '无'} | 依赖: ${(p.dependencies||[]).join(',') || '无'}</small>
      </div>`).join('')
    : '<small>暂无外部插件</small>';
}

async function loadMarket() {
  $('marketMsg').textContent = '';
  const res = await api('/api/market');
  if (res.status === 401) return logout();
  const plugins = res.data.plugins || [];
  $('marketList').innerHTML = plugins.length
    ? plugins.map(p => `<div class="tool"><code>${p.name} ${p.version ? 'v'+p.version : ''}</code>
      <small>${p.description} ${p.author ? ' — ' + p.author : ''} ${(p.tags||[]).join(',') || ''}</small>
      <button class="secondary" style="padding:2px 10px;margin-top:4px" onclick="installMarket('${p.name}')">安装</button></div>`).join('')
    : '<small>市场暂无插件</small>';
}
async function installMarket(name) {
  $('marketMsg').textContent = '安装中...';
  const res = await api('/api/market/install', 'POST', { name });
  if (res.data.ok) { $('marketMsg').textContent = `已安装 ${name},并已重载`; loadPlugins(); }
  else { $('marketMsg').textContent = '安装失败: ' + (res.data.error || ''); }
}
async function reloadPlugins() {
  $('pluginMsg').textContent = '';
  const res = await api('/api/plugins/reload', 'POST', {});
  if (res.data.ok) { $('pluginMsg').textContent = `已重载 ${res.data.plugins} 个插件(${res.data.handlers} handlers)`; loadPlugins(); }
  else { $('pluginMsg').textContent = '重载失败: ' + (res.data.error || ''); }
}

async function loadProviders() {
  const res = await api('/api/providers');
  if (res.status === 401) return logout();
  const providers = res.data.providers || [];
  $('providerList').innerHTML = providers.length
    ? providers.map(p => `<div class="tool"><code>${p.name} — ${p.type}</code><small>模型: ${p.model || '默认'}</small></div>`).join('')
    : '<small>暂无启用的 Provider(见 config.yaml 的 llm/provider_stt/provider_tts/provider_embedding/provider_rerank)</small>';
}
async function testProviders() {
  $('providerMsg').textContent = '测试中...';
  const res = await api('/api/providers/test', 'POST', {});
  if (res.status === 401) return logout();
  const results = res.data.results || [];
  $('providerList').innerHTML = results.length
    ? results.map(r => `<div class="tool"><code>${r.name} ${r.ok ? '✅ 正常' : '❌ 失败'}</code><small>${r.error || ''}</small></div>`).join('')
    : '<small>无可用 Provider</small>';
  $('providerMsg').textContent = '';
}

async function loadKnowledge() {
  const res = await api('/api/knowledge');
  if (res.status === 401) return logout();
  const d = res.data;
  const st = d.stats;
  $('kbStats').innerHTML = st
    ? `<div class="stats">
        <div class="stat"><b>${st.docs}</b><span>文档数</span></div>
        <div class="stat"><b>${st.chunks}</b><span>分块数</span></div>
        <div class="stat"><b>${st.vector_index ? '✅' : '⚠️'}</b><span>向量索引</span></div>
        <div class="stat"><b>${st.embedding ? '✅' : '⚠️'}</b><span>Embedding</span></div>
        <div class="stat"><b>${st.reranker ? '✅' : '⚠️'}</b><span>Rerank</span></div>
        <div class="stat"><b>${st.index_vectors}</b><span>索引向量数</span></div>
      </div>`
    : '<small>知识库未启用</small>';
  const docs = d.docs || [];
  $('kbDocs').innerHTML = docs.length
    ? docs.map(x => `<div class="tool"><code>${x.title}</code><small>分类: ${x.category} | 分块: ${x.chunks}</small>
      <button class="secondary" style="padding:2px 10px;margin-top:4px" onclick="deleteKnowledge('${x.doc_id}')">删除</button></div>`).join('')
    : '<small>暂无文档(共 ' + (d.total || 0) + ' 篇)</small>';
}
async function addKnowledge() {
  $('kbMsg').textContent = ''; $('kbErr').classList.add('hidden');
  const body = { title: $('kbTitle').value.trim(), content: $('kbContent').value.trim(), url: $('kbUrl').value.trim(), file: $('kbFile').value.trim(), category: $('kbCategory').value.trim() || '通用' };
  if (!body.title) { $('kbErr').textContent = '请填写标题'; $('kbErr').classList.remove('hidden'); return; }
  const res = await api('/api/knowledge', 'POST', body);
  if (res.data.ok) { $('kbMsg').textContent = '已入库: ' + res.data.result.chunks + ' 个分块'; $('kbContent').value=''; $('kbUrl').value=''; $('kbFile').value=''; loadKnowledge(); }
  else { $('kbErr').textContent = res.data.error || '入库失败'; $('kbErr').classList.remove('hidden'); }
}
async function deleteKnowledge(doc_id) {
  const res = await api('/api/knowledge', 'DELETE', { doc_id });
  loadKnowledge();
}
async function searchKnowledge() {
  const query = $('kbQuery').value.trim();
  if (!query) return;
  const res = await api('/api/knowledge/search', 'POST', { query, limit: 3 });
  if (res.status === 401) return logout();
  const r = res.data.result || {};
  const results = r.results || [];
  $('kbSearchResult').innerHTML = results.length
    ? `<small style="color:var(--muted)">模式: ${r.mode || ''} | 命中 ${r.count || 0}</small>` + results.map(x =>
      `<div class="tool"><code>${x.title}</code><small>${(x.snippet || x.content || '').slice(0, 300)}</small></div>`).join('')
    : '<small>无匹配结果</small>';
}

let cfgLoaded = false;
async function loadConfig() {
  const res = await api('/api/config');
  if (res.status === 401) return logout();
  $('cfgEditor').value = res.data.content || '';
  cfgLoaded = true;
}
async function saveConfig() {
  $('cfgSaveMsg').textContent = '';
  if (!$('cfgEditor').value.trim()) { $('cfgSaveMsg').textContent = '内容不能为空'; return; }
  const res = await api('/api/config', 'POST', { content: $('cfgEditor').value });
  if (res.data.ok) { $('cfgSaveMsg').textContent = '已保存(需重启生效)'; }
  else { $('cfgSaveMsg').textContent = '保存失败: ' + (res.data.error || ''); $('cfgSaveMsg').style.color = '#ff6b6b'; }
}

async function loadAdapters() {
  const res = await api('/api/adapters');
  if (res.status === 401) return logout();
  const adapters = res.data.adapters || [];
  $('adapterList').innerHTML = adapters.length
    ? adapters.map(a => `
      <div class="tool">
        <code>${a.name} (${a.type})</code>
        <small>平台: ${a.platform} | 状态: ${a.connected ? '已连接' : '未连接'}</small>
      </div>`).join('')
    : '<small>无适配器</small>';
}

let chatWs = null;
function connectChat() {
  if (chatWs && chatWs.readyState <= 1) return;
  chatWs = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/chat', ['chat', 'auth.' + token]);
  let streamBubble = null;
  chatWs.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.role === 'progress') { addChat('progress', d.text); return; }
    if (d.role === 'stream') {
      // 流式 delta:追加到当前流式气泡(无则新建)
      if (!streamBubble || !document.body.contains(streamBubble)) {
        streamBubble = document.createElement('div');
        streamBubble.className = 'msg assistant streaming';
        streamBubble.innerHTML = `<b>AI:</b> <span></span>`;
        $('chat').appendChild(streamBubble);
      }
      streamBubble.querySelector('span').textContent += d.text;
      $('chat').scrollTop = $('chat').scrollHeight;
      return;
    }
    // 最终回复:若有进行中的流式气泡则定稿(替换文本),否则新建
    if (streamBubble && document.body.contains(streamBubble)) {
      streamBubble.querySelector('span').textContent = d.text;
      streamBubble = null;
    } else {
      addChat('assistant', d.text);
    }
  };
  chatWs.onclose = () => { chatWs = null; };
}
function addChat(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const label = role === 'assistant' ? 'AI' : (role === 'progress' ? '⏳' : '我');
  div.innerHTML = `<b>${label}:</b> <span>${text}</span>`;
  $('chat').appendChild(div);
  $('chat').scrollTop = $('chat').scrollHeight;
}
function clearChat() {
  $('chat').innerHTML = '';
  if (chatWs && chatWs.readyState === 1) chatWs.send(JSON.stringify({ text: '/clear', user_id: localStorage.getItem('webui_client_id') || 'webui' }));
}
function sendChat() {
  const text = $('chatInput').value.trim();
  if (!text || !chatWs || chatWs.readyState !== 1) return;
  addChat('user', text);
  $('chatInput').value = '';
  let clientId = localStorage.getItem('webui_client_id');
  if (!clientId) { clientId = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('webui_client_id', clientId); }
  chatWs.send(JSON.stringify({ text, user_id: clientId }));
}
async function sendBroadcast() {
  const group_id = $('broadcastGroup').value.trim();
  const text = $('broadcastText').value.trim();
  $('broadcastErr').classList.add('hidden');
  if (!group_id || !text) {
    $('broadcastErr').textContent = '请填写群号和消息';
    $('broadcastErr').classList.remove('hidden');
    return;
  }
  const res = await api('/api/broadcast', 'POST', { group_id, text });
  if (res.data.ok) { $('broadcastText').value = ''; }
  else { $('broadcastErr').textContent = res.data.error || '发送失败'; $('broadcastErr').classList.remove('hidden'); }
}
function logout() {
  token = ''; localStorage.removeItem('token');
  $('mainView').classList.add('hidden');
  $('loginView').classList.remove('hidden');
}
if (token) { $('loginView').classList.add('hidden'); $('mainView').classList.remove('hidden'); loadStatus(); }
</script>
